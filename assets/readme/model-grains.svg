<svg xmlns="http://www.w3.org/2000/svg" width="640" height="620" viewBox="0 0 640 620" role="img"><rect width="640" height="620" rx="16" fill="#071527"/><g font-family="Segoe UI,Arial,sans-serif"><text x="30" y="45" font-size="27" fill="#EAF4FF">GRAIN BEFORE AGGREGATION</text><text x="30" y="80" font-size="21" fill="#AAC2D8">Gold is a collection of SQL views</text><rect x="30" y="112" width="580" height="80" rx="10" fill="#0B1E36" stroke="#20405B"/><text x="50" y="144" font-size="24" fill="#00C9A7">Order line</text><text x="50" y="173" font-size="20" fill="#EAF4FF">Ordered / picked / unmet units</text><rect x="30" y="212" width="580" height="80" rx="10" fill="#0B1E36" stroke="#20405B"/><text x="50" y="244" font-size="24" fill="#00C9A7">Invoice line</text><text x="50" y="273" font-size="20" fill="#EAF4FF">Billed amounts / recorded profit</text><rect x="30" y="312" width="580" height="80" rx="10" fill="#0B1E36" stroke="#20405B"/><text x="50" y="344" font-size="24" fill="#00C9A7">Purchase line</text><text x="50" y="373" font-size="20" fill="#EAF4FF">Packs / received units / expected value</text><rect x="30" y="412" width="580" height="80" rx="10" fill="#0B1E36" stroke="#20405B"/><text x="50" y="444" font-size="24" fill="#00C9A7">Stock movement</text><text x="50" y="473" font-size="20" fill="#EAF4FF">Signed quantity per transaction</text><text x="30" y="550" font-size="22" fill="#EAF4FF">Join through keys. Keep distinct business grains.</text><text x="30" y="586" font-size="18" fill="#AAC2D8">Future dimensional / semantic model: subject to review.</text></g></svg>